# Schema Generation Profile - Use this to generate complete schema from entities
spring.application.name=HealthConnectProvider
server.port=3012

# Database Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/healthConnect_schema_gen
spring.datasource.username=postgres
spring.datasource.password=postgres

# IMPORTANT: This will generate the complete schema from your entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Liquibase and Flyway during schema generation
spring.liquibase.enabled=false
spring.flyway.enabled=false

# Generate schema files
spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=target/generated-schema.sql
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.script.append=false

# Hibernate schema export
spring.jpa.properties.hibernate.hbm2ddl.auto=create
spring.jpa.defer-datasource-initialization=false
